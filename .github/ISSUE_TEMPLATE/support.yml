name: Get support
description: Ask for help installing or using Stockpile.
title: "[Support] "
body:
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: Your Stockpile version, Minecraft version and operating system.
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
